<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mini Library System</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Mini Library System</h1>
      <p>A Python project by <b>Your Name</b></p>
    </header>
    <!-- the counters at the top -->
    <section class="stats">
      <div class="stat">
        <span id="titleCount">0</span><small>titles</small>
      </div>
      <div class="stat"><span id="copyCount">0</span><small>copies</small></div>
    </section>
    <!-- the form to add a book -->
    <section>
      <h2>Add a book</h2>
      <div class="form">
        <input id="t" type="text" placeholder="Title" />
        <input id="a" type="text" placeholder="Author" />
        <input id="c" type="number" placeholder="Copies" value="1" min="1" />
        <button onclick="addBook()">Add</button>
      </div>
    </section>
    <!-- the list of books -->
    <section>
      <h2>Books on the shelf</h2>
      <div id="shelf"></div>
    </section>

    <section>
        <h2>Borrowed Books</h2>
        <div id="borrowed"></div>
    </section>
    <footer>
      <p>
        Built with HTML, CSS and JavaScript. The Python version lives on my
        GitHub.
      </p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
